version: 2

models:
  - name: stg_epl_match_details
    description: >
      Unified staging model for EPL match metadata across seasons (2020-2026).
      Normalizes team names, scores, venue info, and imputes missing columns like 'has_xg' for older seasons.
    columns:
      - name: match_id
        description: "Unique identifier for the match from SofaScore."
        tests:
          - unique
          - not_null
      - name: event_id
        description: "Alternative event identifier."
      - name: season_name
        description: "Season identifier (e.g., '20/21')."
      - name: start_timestamp
        description: "Unix timestamp of match start."
      - name: match_date
        description: "Parsed TIMESTAMP of match start."
      - name: home_team_json
        description: "Raw JSON string containing home team details (name, id, slug)."
      - name: away_team_json
        description: "Raw JSON string containing away team details."
      - name: home_score
        description: "Final score for the home team."
      - name: away_score
        description: "Final score for the away team."
      - name: winner_code
        description: "Code indicating the winner: 1 (Home), 2 (Away), 3 (Draw)."
      - name: has_xg
        description: "Boolean indicating if xG data is natively available (imputed to TRUE for 20/21)."

  - name: stg_epl_match_shots
    description: >
      Unified staging model for EPL match shots data across seasons (2020-2026).
      Includes shot coordinates, types, and xG metrics (with NULLs for missing historical data).
    columns:
      - name: shot_id
        description: "Unique identifier for the shot event."
        tests:
          - unique
          - not_null
      - name: match_id
        description: "Foreign key to the match."
        tests:
          - not_null
      - name: player_name
        description: "Name of the player who took the shot (may be JSON string)."
      - name: xg
        description: "Expected Goals value (0.0-1.0). NULL for 2020-2021 before imputation."
      - name: shot_type
        description: "Outcome of the shot (Goal, Save, Miss, Block, etc.)."

  - name: stg_epl_team_match_stats
    description: >
      Unified staging model for aggregated team statistics (possession, fouls, etc.).
      Standardizes numeric types to FLOAT64 to handle schema drift between seasons.
    columns:
      - name: match_id
        description: "Foreign key to the match."
      - name: metric_name
        description: "Name of the statistic (e.g., 'Ball possession', 'Total shots')."
      - name: home_value
        description: "Value for the home team."
      - name: away_value
        description: "Value for the away team."

