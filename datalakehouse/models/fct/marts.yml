version: 2

models:
  - name: fct_matches
    description: >
      Final fact table for EPL matches (Marts Layer).
      Joins match context (teams, scores, venue) with pivoted statistics (possession, xG, shots).
      Ideal for 'Match Outcome Prediction' ML models.
    columns:
      - name: match_id
        tests:
          - unique
          - not_null
      - name: home_win_flag
        description: "Target Variable: 1 if Home Team won, 0 otherwise."
      - name: away_win_flag
        description: "Target Variable: 1 if Away Team won, 0 otherwise."
      - name: draw_flag
        description: "Target Variable: 1 if Match was a Draw, 0 otherwise."
      - name: home_xg
        description: "Total Expected Goals for home team."
      - name: away_xg
        description: "Total Expected Goals for away team."

  - name: fct_epl_match_shots
    description: >
      Final fact table for EPL shots (Marts Layer).
      Contains granular data for every shot, enriched with boolean flags and imputed xG values for historical data.
      Ideal for 'xG Modeling' and 'Player Performance' analysis.
    columns:
      - name: shot_id
        tests:
          - unique
          - not_null
      - name: match_id
        tests:
          - not_null
      - name: xg
        description: "Best available xG metric (Actual or ML-Imputed)."
      - name: is_imputed
        description: "Indicates if the xG value was generated by our BQML model."
      - name: is_goal
        description: "1 if the shot resulted in a goal, 0 otherwise."

